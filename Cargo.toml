[workspace]
resolver = "3"
members = ["kernel"]

[features]
exception-self-test = ["kernel/exception-self-test"]
divide-error-self-test = ["kernel/divide-error-self-test"]

[package]
name = "rustalis"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
ovmf-prebuilt = "0.2.4"

[build-dependencies]
kernel = { path = "kernel", artifact = "bin", target = "x86_64-unknown-none" }
bootloader = "0.11.17"
